apiVersion: v1
kind: Service
metadata:
  name: {{ include "authentik-outpost.fullname" . }}
  labels:
    {{- include "authentik-outpost.labels" . | nindent 4 }}
spec:
  type: {{.Values.service.type }}
  ports:
    - port: {{.Values.service.portHttp }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{.Values.service.portHttps }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "authentik-outpost.selectorLabels" . | nindent 4 }}