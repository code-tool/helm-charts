---
# Source: authentik-outpost/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-file-test-authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2026.8.3"
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost
      app.kubernetes.io/instance: golden-file-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-outpost
        app.kubernetes.io/instance: golden-file-test
    spec:
      containers:
        - name: ldap
          image: "ghcr.io/goauthentik/ldap:2026.8.3"
          imagePullPolicy: IfNotPresent
          ports:
            - name: ldap
              containerPort: 3389
              protocol: TCP
            - name: ldaps
              containerPort: 6636
              protocol: TCP
            - name: metrics
              containerPort: 9300
              protocol: TCP
          envFrom:
            - secretRef:
                name: golden-file-test-authentik-outpost
          startupProbe:
            failureThreshold: 120
            periodSeconds: 10
            tcpSocket:
              port: 6636
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            tcpSocket:
              port: 6636
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 30
            tcpSocket:
              port: 6636
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
# Source: authentik-outpost/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: golden-file-test-authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2026.8.3"
type: Opaque
data:
  AUTHENTIK_HOST: "aHR0cHM6Ly9hdXRoZW50aWsudGVzdC5jb20="
  AUTHENTIK_TOKEN: "dG9rZW4="
  AUTHENTIK_INSECURE: "ZmFsc2U="
---
# Source: authentik-outpost/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: golden-file-test-authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2026.8.3"
spec:
  type: LoadBalancer
  loadBalancerIP: "42.0.0.0"
  loadBalancerSourceRanges:
    - 10.0.0.0/8
  ports:
    - port: 389
      targetPort: ldap
      protocol: TCP
      name: ldap
    - port: 636
      targetPort: ldaps
      protocol: TCP
      name: ldaps
    - port: 9300
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test