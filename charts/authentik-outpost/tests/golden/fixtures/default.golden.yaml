---
# Source: authentik-outpost/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-file-test-authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2026.2.6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost
      app.kubernetes.io/instance: golden-file-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-outpost
        app.kubernetes.io/instance: golden-file-test
    spec:
      containers:
        - name: proxy
          image: "ghcr.io/goauthentik/proxy:2026.2.6"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: https
              containerPort: 9443
              protocol: TCP
          envFrom:
            - secretRef:
                name: golden-file-test-authentik-outpost
          livenessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
# Source: authentik-outpost/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: golden-file-test-authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2026.2.6"
type: Opaque
data:
