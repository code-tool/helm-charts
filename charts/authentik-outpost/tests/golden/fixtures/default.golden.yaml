---
# Source: authentik-outpost/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: golden-file-test-authentik-outpost
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "2026.2.6"
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: http
      protocol: TCP
      name: http
    - port: 9443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: golden-file-test
---
# Source: authentik-outpost/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golden-file-test-authentik-outpost
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
spec:
  ingressClassName: nginx
  rules:
    - host: outpost.test.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: golden-file-test-authentik-outpost
                port:
                  name: http
    - host: service.test.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: golden-file-test-authentik-outpost
                port:
                  name: http