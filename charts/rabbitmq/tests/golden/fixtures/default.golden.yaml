# Source: rabbitmq/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golden-file-test-rabbitmq
  namespace: "test-namespace"
  labels:
    app.kubernetes.io/instance: golden-file-test
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/version: 4.2.9
spec:
  serviceName: golden-file-test-rabbitmq-headless
  podManagementPolicy: OrderedReady
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: golden-file-test
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden-file-test
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/version: 4.2.9
      annotations:
        checksum/config: 8c1e3535104a69f3619deae667bf7392c4d169e9fea2dbd6bb3ec3552001c7ca
        checksum/secret: 618fd82ef4f3b4a37a9455a1ec36e11d9198637b45831dc09eaf6a4516d61ae0
    spec:
      
      serviceAccountName: golden-file-test-rabbitmq
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: golden-file-test
                    app.kubernetes.io/name: rabbitmq
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      terminationGracePeriodSeconds: 120
      enableServiceLinks: true
      initContainers:
        - name: prepare-rabbitmq
          image: docker.io/library/rabbitmq:4.2.9-management
          imagePullPolicy: "IfNotPresent"
          resources:
            limits:
              cpu: 375m
              ephemeral-storage: 2Gi
              memory: 384Mi
            requests:
              cpu: 250m
              ephemeral-storage: 50Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
          args:
            - -ec
            - |
              echo "Rendering RabbitMQ configuration into /etc/rabbitmq"
              mkdir -p /etc/rabbitmq/conf.d
              if [[ -f /rabbitmq-config/rabbitmq.conf ]]; then
                cp /rabbitmq-config/rabbitmq.conf /etc/rabbitmq/rabbitmq.conf
              fi
              if [[ -f /rabbitmq-config/advanced.config ]]; then
                cp /rabbitmq-config/advanced.config /etc/rabbitmq/advanced.config
              fi
              echo '[rabbitmq_management,rabbitmq_peer_discovery_k8s,rabbitmq_auth_backend_ldap].' > /etc/rabbitmq/enabled_plugins

              if [[ -n "${RABBITMQ_PASSWORD_FILE:-}" ]]; then
                RABBITMQ_PASSWORD="$(< "${RABBITMQ_PASSWORD_FILE}")"
              fi
              {
                echo "default_user = ${RABBITMQ_USERNAME}"
                echo "default_pass = ${RABBITMQ_PASSWORD}"
              } > /etc/rabbitmq/conf.d/10-default-user.conf
              chmod 600 /etc/rabbitmq/conf.d/10-default-user.conf

              # $HOME is /var/lib/rabbitmq in the official image
              if [[ -n "${ERLANG_COOKIE_FILE:-}" ]]; then
                ERLANG_COOKIE="$(< "${ERLANG_COOKIE_FILE}")"
              fi
              rm -f "${HOME}/.erlang.cookie"
              printf '%s' "${ERLANG_COOKIE}" > "${HOME}/.erlang.cookie"
              chmod 400 "${HOME}/.erlang.cookie"
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(MY_POD_NAME).golden-file-test-rabbitmq-headless.$(MY_POD_NAMESPACE).svc.cluster.local"
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_MNESIA_DIR
              value: "/var/lib/rabbitmq/mnesia/$(RABBITMQ_NODENAME)"
            - name: RABBITMQ_USERNAME
              value: "user"
            - name: RABBITMQ_PASSWORD_FILE
              value: /etc/rabbitmq-secrets/rabbitmq-password
            - name: ERLANG_COOKIE_FILE
              value: /etc/rabbitmq-secrets/rabbitmq-erlang-cookie
          volumeMounts:
            - name: configuration
              mountPath: /rabbitmq-config
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            - name: empty-dir
              mountPath: /etc/rabbitmq
              subPath: app-conf-dir
            - name: empty-dir
              mountPath: /var/lib/rabbitmq
              subPath: app-home-dir
            - name: data
              mountPath: /var/lib/rabbitmq/mnesia
            - name: rabbitmq-secrets
              mountPath: /etc/rabbitmq-secrets
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:4.2.9-management
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    rabbitmqctl --quiet stop_app || true
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(MY_POD_NAME).golden-file-test-rabbitmq-headless.$(MY_POD_NAMESPACE).svc.cluster.local"
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_MNESIA_DIR
              value: "/var/lib/rabbitmq/mnesia/$(RABBITMQ_NODENAME)"
            - name: RABBITMQ_LOGS
              value: "-"
            - name: ERL_CRASH_DUMP
              value: "/var/log/rabbitmq/erl_crash.dump"
          envFrom:
          ports:
            - name: amqp
              containerPort: 5672
            - name: dist
              containerPort: 25672
            - name: stats
              containerPort: 15672
            - name: epmd
              containerPort: 4369
            - name: metrics
              containerPort: 9419
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 120
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 20
            exec:
              command:
                - /bin/bash
                - -ec
                - rabbitmq-diagnostics -q ping
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 20
            exec:
              command:
                - /bin/bash
                - -ec
                - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms
          resources:
            limits:
              cpu: 375m
              ephemeral-storage: 2Gi
              memory: 384Mi
            requests:
              cpu: 250m
              ephemeral-storage: 50Mi
              memory: 256Mi
          volumeMounts:
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            - name: empty-dir
              mountPath: /etc/rabbitmq
              subPath: app-conf-dir
            - name: empty-dir
              mountPath: /var/lib/rabbitmq
              subPath: app-home-dir
            - name: empty-dir
              mountPath: /var/log/rabbitmq
              subPath: app-logs-dir
            - name: data
              mountPath: /var/lib/rabbitmq/mnesia
            - name: rabbitmq-secrets
              mountPath: /etc/rabbitmq-secrets
      volumes:
        - name: empty-dir
          emptyDir: {}
        - name: configuration
          projected:
            sources:
              - secret:
                  name: golden-file-test-rabbitmq-config
        - name: rabbitmq-secrets
          projected:
            sources:
              - secret:
                  name: golden-file-test-rabbitmq
              - secret:
                  name: golden-file-test-rabbitmq
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/instance: golden-file-test
          app.kubernetes.io/name: rabbitmq
      spec:
        accessModes:
            - "ReadWriteOnce"
        resources:
          requests:
            storage: "8Gi"

