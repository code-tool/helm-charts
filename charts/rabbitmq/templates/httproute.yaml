{{- if .Values.gatewayApi.enabled }}
{{- if empty .Values.gatewayApi.parentRefs }}
{{- fail "gatewayApi.parentRefs cannot be empty when gatewayApi is enabled" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if or .Values.gatewayApi.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.gatewayApi.annotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "common.tplvalues.render" ( dict "value" .Values.gatewayApi.parentRefs "context" $ ) | nindent 4 }}
  {{- if or .Values.gatewayApi.hostname .Values.gatewayApi.extraHostnames }}
  hostnames:
    {{- if .Values.gatewayApi.hostname }}
    - {{ include "common.tplvalues.render" ( dict "value" .Values.gatewayApi.hostname "context" $ ) }}
    {{- end }}
    {{- range .Values.gatewayApi.extraHostnames }}
    - {{ include "common.tplvalues.render" ( dict "value" . "context" $ ) }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gatewayApi.pathType }}
            value: {{ .Values.gatewayApi.path }}
      {{- if .Values.gatewayApi.filters }}
      filters:
        {{- include "common.tplvalues.render" ( dict "value" .Values.gatewayApi.filters "context" $ ) | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "common.names.fullname" . }}
          port: {{ .Values.service.ports.manager }}
    {{- if .Values.gatewayApi.extraRules }}
    {{- include "common.tplvalues.render" (dict "value" .Values.gatewayApi.extraRules "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
