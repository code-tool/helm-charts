{{- if .Values.httpRoute.enabled }}
{{- if empty .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs cannot be empty when httpRoute is enabled" }}
{{- end }}
{{- if empty .Values.httpRoute.hostnames }}
{{- fail "httpRoute.hostnames cannot be empty when httpRoute is enabled" }}
{{- end }}
apiVersion: {{ .Values.httpRoute.apiVersion }}
kind: HTTPRoute
metadata:
  name: {{ include "karma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karma.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
  {{- range .Values.httpRoute.hostnames }}
    - {{ tpl . $ | quote }}
  {{- end }}
  rules:
  {{- with .Values.httpRoute.extraRules }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.path | default "/" | quote }}
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "karma.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
